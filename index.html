<style>
  :root{
    --ink:#1A1613;
    --ecru:#F4EFE5;
    --stone:#D9D2C3;
    --orange:#F95004;
    --orange-dim:#C94202;
    --yellow:#F5C518;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ecru);
    color:var(--ink);
    font-family:'DM Sans',system-ui,sans-serif;
    display:flex;
    align-items:stretch;
    justify-content:center;
    min-height:100dvh;
  }
  .app{
    width:100%;
    max-width:420px;
    min-height:100dvh;
    background:#fff;
    border:1.5px solid var(--stone);
    border-radius:0;
    overflow:hidden;
    box-shadow:0 2px 0 var(--stone);
    display:flex;
    flex-direction:column;
  }
  @media (min-width:480px){
    body{ align-items:center; padding:24px; }
    .app{ min-height:min(calc(100dvh - 48px), 640px); border-radius:20px; }
  }
  .app-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px 24px 16px;
    border-bottom:1.5px solid var(--stone);
  }
  .app-header img{
    width:28px;height:28px;display:block;
  }
  .app-header .brand{
    font-weight:900;
    font-size:15px;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  .app-header .brand span{color:var(--orange);}
  .steps{
    display:flex;
    gap:6px;
    padding:16px 24px 0;
  }
  .step-dot{
    flex:1;
    height:3px;
    border-radius:2px;
    background:var(--stone);
    transition:background .25s ease;
  }
  .step-dot.active{background:var(--orange);}
  .screen{
    padding:28px 24px 32px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .screen[hidden]{display:none;}
  .eyebrow{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--orange-dim);
    margin:0 0 6px;
  }
  h1{
    font-size:22px;
    font-weight:900;
    margin:0 0 20px;
    line-height:1.25;
  }
  .price-input-wrap{
    display:flex;
    align-items:baseline;
    border:1.5px solid var(--stone);
    border-radius:var(--radius);
    padding:14px 18px;
    margin-bottom:auto;
  }
  .price-input-wrap:focus-within{
    border-color:var(--orange);
  }
  .price-input-wrap span{
    font-size:26px;
    font-weight:700;
    color:var(--stone);
    margin-right:6px;
  }
  .price-input-wrap input{
    border:none;
    outline:none;
    font-family:'DM Sans',sans-serif;
    font-size:26px;
    font-weight:700;
    width:100%;
    color:var(--ink);
    background:transparent;
  }
  .price-input-wrap input::placeholder{color:var(--stone);}
  .choice-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:auto;
  }
  .choice{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    text-align:left;
    border:1.5px solid var(--stone);
    border-radius:var(--radius);
    padding:16px 18px;
    background:#fff;
    font-family:'DM Sans',sans-serif;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice:hover{border-color:var(--orange);}
  .choice:active{background:var(--ecru);}
  .choice .label{
    font-weight:700;
    font-size:15px;
  }
  .choice .rate{
    font-weight:900;
    font-size:15px;
    color:var(--orange);
  }
  .result-block{
    text-align:center;
    margin:auto 0;
  }
  .result-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--stone);
    margin-bottom:10px;
  }
  .result-value{
    font-size:44px;
    font-weight:900;
    color:var(--orange);
    line-height:1.1;
  }
  .result-sub{
    font-size:13px;
    color:var(--ink);
    opacity:0.6;
    margin-top:8px;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:24px;
  }
  button.primary,button.ghost{
    font-family:'DM Sans',sans-serif;
    font-weight:700;
    font-size:14px;
    border-radius:var(--radius);
    padding:14px 18px;
    cursor:pointer;
    border:1.5px solid transparent;
  }
  button.primary{
    background:var(--orange);
    color:#fff;
    border-color:var(--orange);
    flex:1;
  }
  button.primary:hover{background:var(--orange-dim);}
  button.primary:disabled{
    background:var(--stone);
    border-color:var(--stone);
    cursor:not-allowed;
  }
  button.ghost{
    background:#fff;
    color:var(--ink);
    border-color:var(--stone);
  }
  button.ghost:hover{border-color:var(--ink);}
  .back-row{
    margin-top:14px;
  }
  .back-link{
    background:none;
    border:none;
    font-family:'DM Sans',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    opacity:0.55;
    cursor:pointer;
    padding:4px 0;
  }
  .back-link:hover{opacity:1;}
  .copy-feedback{
    font-size:12px;
    font-weight:700;
    color:var(--orange);
    text-align:center;
    height:16px;
    margin-top:8px;
    opacity:0;
    transition:opacity .2s ease;
  }
  .copy-feedback.show{opacity:1;}
  .app-footer{
    text-align:center;
    font-size:11px;
    font-weight:400;
    letter-spacing:0.02em;
    color:var(--stone);
    padding:12px 24px 18px;
    border-top:1.5px solid var(--stone);

jAJiW4S1DjQYW8MAvCBMAHhBmADwgjAB4AVhAsALwgSAF4QJAC8IEwBeECYAvCBMAHhBmADwgjAB4AVhAsALwgSAF4QJAC8IEwBeECYAvCBMAHhBmADwgjAB4AVhAsALwgSAF4QJAC8IEwBeECYAvCBMAHhBmADwgjAB4AVhAsALwgSAF4QJAC8IEwBeECYAvEh+/LA7JSJTgZ8DQLMN/h+h7OQOy3c5iwAAAABJRU5ErkJggg==" alt="Faberhaus">
    <div class="brand">Faberhaus <span>Retail Calculator</span></div>
  </div>

  <div class="steps">
    <div class="step-dot active" data-dot="1"></div>
    <div class="step-dot" data-dot="2"></div>
    <div class="step-dot" data-dot="3"></div>
  </div>

  <!-- Écran 1 : prix -->
  <section class="screen" id="screen-1">
    <p class="eyebrow">Étape 1</p>
    <h1>Prix de l'objet neuf</h1>
    <div class="price-input-wrap">
      <input type="text" inputmode="decimal" id="priceInput" placeholder="0,00" autofocus>
      <span>€</span>
    </div>
    <div class="actions">
      <button class="primary" id="toStep2" disabled>Continuer</button>
    </div>
  </section>

  <!-- Écran 2 : état -->
  <section class="screen" id="screen-2" hidden>
    <p class="eyebrow">Étape 2</p>
    <h1>Dans quel état ?</h1>
    <div class="choice-list">
      <button class="choice" data-rate="0.85" data-label="Neuf emballé">
        <span class="label">Neuf emballé</span>
        <span class="rate">85 %</span>
      </button>
      <button class="choice" data-rate="0.70" data-label="Neuf ouvert">
        <span class="label">Neuf ouvert</span>
        <span class="rate">70 %</span>
      </button>
      <button class="choice" data-rate="0.50" data-label="Utilisé">
        <span class="label">Utilisé</span>
        <span class="rate">50 %</span>
      </button>
    </div>
    <div class="back-row">
      <button class="back-link" id="toStep1From2">← Revenir au prix</button>
    </div>
  </section>

  <!-- Écran 3 : résultat -->
  <section class="screen" id="screen-3" hidden>
    <p class="eyebrow">Résultat</p>
    <h1 id="resultTitle">Prix de rachat</h1>
    <div class="result-block">
      <div class="result-label" id="resultCondition">—</div>
      <div class="result-value" id="resultValue">0,00 €</div>
      <div class="result-sub" id="resultDetail"></div>
      <div class="copy-feedback" id="copyFeedback">Copié</div>
    </div>
    <div class="actions">
      <button class="ghost" id="restart">Nouveau calcul</button>
      <button class="primary" id="copyBtn">Copier le résultat</button>
    </div>
  </section>

  <div class="app-footer">© Faberhaus Beaufays · v1.0</div>
</div>

<script>
  const screens = {
    1: document.getElementById('screen-1'),
    2: document.getElementById('screen-2'),
    3: document.getElementById('screen-3'),
  };
  const dots = document.querySelectorAll('.step-dot');

  let priceValue = null;
  let chosenRate = null;
  let chosenLabel = null;

  function goTo(step){
    Object.values(screens).forEach(s => s.hidden = true);
    screens[step].hidden = false;
    dots.forEach(d => d.classList.toggle('active', Number(d.dataset.dot) <= step));
  }

  function parseFrenchNumber(str){
    if(!str) return NaN;
    const normalized = str.replace(/\s/g,'').replace(',', '.');
    return parseFloat(normalized);
  }

  function formatEuro(value){
    return value.toLocaleString('fr-BE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  }

  // Étape 1
  const priceInput = document.getElementById('priceInput');
  const toStep2 = document.getElementById('toStep2');

  priceInput.addEventListener('input', () => {
    const val = parseFrenchNumber(priceInput.value);
    toStep2.disabled = !(val > 0);
  });

  priceInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !toStep2.disabled) toStep2.click();
  });

  toStep2.addEventListener('click', () => {
    priceValue = parseFrenchNumber(priceInput.value);
    goTo(2);
  });

  document.getElementById('toStep1From2').addEventListener('click', () => goTo(1));

  // Étape 2
  document.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      chosenRate = parseFloat(btn.dataset.rate);
      chosenLabel = btn.dataset.label;
      const result = priceValue * chosenRate;

      document.getElementById('resultCondition').textContent = chosenLabel + ' · ' + Math.round(chosenRate*100) + ' %';
      document.getElementById('resultValue').textContent = formatEuro(result);
      document.getElementById('resultDetail').textContent =
        'Prix neuf indiqué : ' + formatEuro(priceValue);

      goTo(3);
    });
  });

  // Étape 3
  document.getElementById('restart').addEventListener('click', () => {
    priceValue = null; chosenRate = null; chosenLabel = null;
    priceInput.value = '';
    toStep2.disabled = true;
    document.getElementById('copyFeedback').classList.remove('show');
    goTo(1);
    priceInput.focus();
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const text = document.getElementById('resultValue').textContent;
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    const fb = document.getElementById('copyFeedback');
    fb.classList.add('show');
    setTimeout(() => fb.classList.remove('show'), 1500);
  });
</script>

</body>
</html>
